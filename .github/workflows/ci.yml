# CI baseline (plan 00 T6 / plan 08 T4): every gate, least privilege,
# pinned action SHAs, cancel-in-progress. Humans and loops run the same
# gates via `just check` (P5: gates are never lowered).
#
# Only one third-party action (checkout), pinned by full SHA. The Rust
# toolchain comes from the runner's rustup honouring rust-toolchain.toml —
# no setup action to vet.

name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Tests (unit, golden, property, conformance, e2e, architecture)
        run: cargo test --workspace
      - name: Docs build clean
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: CLI self-check (fixture must exit 1 with diagnostics)
        run: |
          set +e
          cargo run -q -p cite-lint-cli -- check testdata/e2e/memo.md
          code=$?
          set -e
          test "$code" -eq 1
