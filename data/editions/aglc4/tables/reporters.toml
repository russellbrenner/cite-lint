# AGLC4 law report series vocabulary (invariant 2: data before rules).
#
# year_bracket: "round" = series organised by volume number, year in round
# brackets, e.g. (1992) 175 CLR 1; "square" = series organised by year, year
# in square brackets identifying the volume, e.g. [1969] VR 403 (AGLC4 r 2.2.4).
#
# Provenance (P9): every row records how it was produced, the AGLC4 anchor it
# derives from, and its review status. Hand-authored M1 seed rows are pending
# verification against the AGLC4 PDF (plan 02's ingestion oracle will audit
# and extend this table). Do not add rows without provenance — the schema
# loader rejects them.

[[reporter]]
abbrev = "CLR"
full = "Commonwealth Law Reports"
year_bracket = "round"
court = "HCA"
jurisdiction = "Cth"
[reporter.provenance]
method = "hand-authored"
anchor = "AGLC4 Appendix A (law report series); r 2.2.4 (year and volume)"
reviewer = "drafted claude-opus-4.8 2026-06-05; pending human verification"

