# AGLC4 court vocabulary: unique court identifiers as used in medium-neutral
# citations (AGLC4 r 2.3.1), with jurisdiction and full name.
#
# Provenance (P9): hand-authored M1 seed. Six federal/family entries verified
# 2026-06-05 against AGLC4 Appendix B reproductions (USC, ECU, Newcastle, ANU
# libguides); all confirmed. Plan 02 ingestion will audit page-by-page.
#
# Note: FamCA/FamCAFC identify the Family Court of Australia, abolished
# 1 September 2021 (merged into the FedCFamC) — valid for pre-2021 judgments
# only. Post-2021 family-law citations use the FedCFamC identifiers below.

